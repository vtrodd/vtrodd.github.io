<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="hamburger-icon" fill="none" stroke="currentColor"
  stroke-width="2">
  <defs>
    <style>
      .line {
        /* Smooth CSS transition for both path morphing and opacity */
        transition: 0.4s ease;
      }

      .middle {
        transition-delay: 50ms;
      }

      .top {
        transition-delay: 150ms;
      }

      [data-menu-active="true"] .hamburger-icon {

        .line {
          d: path("M 4 14 L 12 19 L 20 14");
        }

        .top,
        .middle {
          opacity: 0;
        }

        .top {
          transition-delay: 150ms;
        }

        .middle {
          transition-delay: 50ms;
        }
    </style>
  </defs>

  <path class="line top" d="M 3 7 L 12 7 L 21 7" />
  <path class="line middle" d="M 3 12 L 12 12 L 21 12" />
  <path class="line bottom" d="M 3 17 L 12 17 L 21 17" />
</svg>