<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 24" fill="currentColor" class="switch-icon">
  <defs>
    <style>
      .switch-icon {
        transition: all 0.2s ease-in-out;
      }

      .switch-icon line {
        transform-origin: 12px 12px;
        transition: all 0.2s ease-in-out;
      }

      :root[data-theme="dark"] .switch-icon line {
        transform: rotate(-83.25deg);
      }
    </style>
  </defs>
  <rect x="9" y="4" width="6" height="16" />
  <line x1="12" y1="12" x2="3" y2="4" stroke="currentColor" stroke-width="3" />

</svg>